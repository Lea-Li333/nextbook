<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Nextbook Demo</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: slim brand bar + segmented tabs; each tab is one product surface centred on the page. Clean, techy, cool neutrals, one cobalt accent. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunk:#eef0f4; --ink:#131722; --muted:#5a6273; --line:#e1e4ea;
  --accent:#2b56e3; --accent-ink:#ffffff; --accent-soft:rgba(43,86,227,.10);
  --good:#177a48; --good-soft:rgba(23,122,72,.10); --neg:#c1362c; --neg-soft:rgba(193,54,44,.09);
  --bezel:#2a2e36; --eink:#eeede8; --eink-ink:#1c1c1a; --eink-muted:#5f5e59; --eink-line:#cfcdc6;
  --shadow:0 1px 2px rgba(19,23,34,.06),0 8px 24px rgba(19,23,34,.06);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#151921; --sunk:#1f2530; --ink:#e7eaf0; --muted:#97a0b1; --line:#262c37;
  --accent:#7d9bff; --accent-ink:#0d1016; --accent-soft:rgba(125,155,255,.14);
  --good:#4cc68a; --good-soft:rgba(76,198,138,.12); --neg:#ff7a6e; --neg-soft:rgba(255,122,110,.12);
  --bezel:#050608; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#151921; --sunk:#1f2530; --ink:#e7eaf0; --muted:#97a0b1; --line:#262c37;
  --accent:#7d9bff; --accent-ink:#0d1016; --accent-soft:rgba(125,155,255,.14);
  --good:#4cc68a; --good-soft:rgba(76,198,138,.12); --neg:#ff7a6e; --neg-soft:rgba(255,122,110,.12);
  --bezel:#050608; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:0 56px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 16px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tabs{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:12px;margin-block:0 26px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;padding:10px 14px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.stage{display:flex;justify-content:center;min-width:0}

/* chips */
.groups{display:grid;gap:12px}
.group{display:grid;gap:6px}
.gl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip .ic{width:12px;height:12px;display:none}
.chip[data-s="1"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[data-s="1"] .ic.ok{display:block}
.chip[data-s="-1"]{background:var(--neg-soft);border-color:var(--neg);color:var(--neg);text-decoration:line-through;text-decoration-thickness:1px}
.chip[data-s="-1"] .ic.no{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* fine-tune */
.tune{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tune>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:10px 12px;font-size:13.5px;font-weight:600}
.tune>summary::-webkit-details-marker{display:none}
.tune>summary .car{width:12px;height:12px;transition:transform .15s;flex:none}
.tune[open]>summary .car{transform:rotate(90deg)}
.tune .act{display:flex;flex-wrap:wrap;gap:4px;font-weight:400}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-mono)}
.tag.dim{background:var(--sunk);color:var(--muted)}
.tune .body{padding:4px 12px 12px;display:grid;gap:12px}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px}
.sl{display:grid;gap:2px;font-size:12.5px}
.sl .lh{display:flex;justify-content:space-between;gap:6px}
.sl label{font-weight:500;font-size:13px}
.sl output{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.sl output.on{color:var(--accent)}
.sl input{width:100%;accent-color:var(--accent);margin:2px 0}
.sl .ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px}
.tune .foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-size:13px}
.tune .foot label{display:inline-flex;align-items:center;gap:6px}
.tune .foot input{accent-color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:13px;text-decoration:underline;text-underline-offset:3px}

/* covers & picks */
.cover{flex:none;border-radius:4px 6px 6px 4px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:8px 7px 7px 10px;box-shadow:inset 3px 0 0 rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.15)}
.cover .t{font-weight:600;font-size:11px;line-height:1.15}
.cover .a{font-size:8.5px;opacity:.85;letter-spacing:.03em;text-transform:uppercase}
.cover::after{content:"";position:absolute;inset:auto 7px 24px 10px;height:1px;background:rgba(255,255,255,.35)}
.meta{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.picks{display:grid;gap:10px}
.pick{border:1px solid var(--line);border-radius:12px;background:var(--surface);display:grid;min-width:0}
.pick .head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px}
.pick h4{font-size:15px;line-height:1.25}
.pick .by{color:var(--muted);font-size:12.5px}
.scoreline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px}
.match{font-family:var(--f-mono);font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.subscore{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.pick .why{font-size:13px;margin-top:6px}
.pick .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.empty{font-size:13px;color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:10px}
.powered{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.powered .mark{width:16px;height:16px;border-radius:4px}
.powered .mark svg{width:10px;height:10px}

/* analysis */
.ana{border-top:1px solid var(--line)}
.ana>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:500;color:var(--accent);display:flex;align-items:center;gap:6px}
.ana>summary::-webkit-details-marker{display:none}
.ana>summary .car{width:11px;height:11px;transition:transform .15s}
.ana[open]>summary .car{transform:rotate(90deg)}
.ana .in{padding:2px 12px 14px;display:grid;gap:14px}
.ana h5{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);font-weight:500}
.comp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.comp div{background:var(--sunk);border-radius:8px;padding:8px 10px;display:grid;gap:2px}
.comp b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.comp span{font-size:11.5px;color:var(--muted)}
.els{display:grid;gap:4px;font-size:13px;margin:0;padding:0;list-style:none}
.els li{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:6px;align-items:center}
.els .st{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.els svg{width:13px;height:13px}
.els .y{color:var(--good)} .els .n{color:var(--muted)} .els .x{color:var(--neg)}
.prof{display:grid;gap:7px}
.pr{display:grid;grid-template-columns:78px minmax(0,1fr) 104px;gap:10px;align-items:center;font-size:12.5px}
.pr .trk{position:relative;height:16px}
.pr .trk::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line);border-radius:1px}
.pr .tgt{position:absolute;top:2px;height:12px;border-radius:6px;background:var(--accent-soft);border:1px dashed var(--accent)}
.pr .src{position:absolute;top:1px;width:2px;height:14px;background:var(--muted);margin-left:-1px}
.pr .dot{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
.pr .v{font-size:11.5px;color:var(--muted);text-align:right;font-family:var(--f-mono)}
.pr .v.ok{color:var(--good)} .pr .v.off{color:var(--neg)}
.pkey{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--muted)}
.pkey i{display:inline-block;vertical-align:-2px;margin-right:5px}
.pkey .k1{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pkey .k2{width:2px;height:12px;background:var(--muted)}
.pkey .k3{width:16px;height:10px;border-radius:5px;background:var(--accent-soft);border:1px dashed var(--accent)}
.also{font-size:12.5px;color:var(--muted)}
.ranked{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.more{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.more .hint{font-size:12px;color:var(--muted)}

/* e-reader */
.ereader{width:min(100%,470px);background:var(--bezel);border-radius:26px;padding:22px 18px 40px;box-shadow:var(--shadow);position:relative}
.ereader::after{content:"";position:absolute;left:50%;bottom:14px;width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);transform:translateX(-50%)}
.eink{--surface:var(--eink);--ink:var(--eink-ink);--muted:var(--eink-muted);--line:var(--eink-line);--sunk:#e3e1da;--accent:var(--eink-ink);--accent-ink:var(--eink);--accent-soft:rgba(28,28,26,.07);--good:var(--eink-ink);--good-soft:rgba(28,28,26,.07);--neg:#6b6a64;--neg-soft:transparent;
  background:var(--eink);color:var(--eink-ink);border-radius:6px;height:660px;overflow:auto;position:relative;font-size:14px;color-scheme:light}
.eink .bar{display:flex;justify-content:space-between;font-size:11px;color:var(--eink-muted);padding:8px 14px;border-bottom:1px solid var(--eink-line);font-family:var(--f-mono);position:sticky;top:0;background:var(--eink);z-index:2}
.eink .page{font-family:var(--f-read);padding:26px 26px 20px;font-size:15.5px;line-height:1.65}
.eink .page p{margin:0 0 12px}
.eink .end{text-align:center;letter-spacing:.3em;font-size:12px;margin-top:22px;color:var(--eink-muted)}
.sheet{border-top:2px solid var(--eink-ink);padding:16px 16px 20px;display:grid;gap:12px}
.sheet h3{font-size:17px;font-weight:600;line-height:1.25}
.sheet p{margin:0;font-size:13.5px;color:var(--eink-muted)}
.eink .cover{filter:grayscale(1) contrast(1.05)}
.eink .dot{box-shadow:none}
.steps{display:flex;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--eink-muted);flex-wrap:wrap}
.steps span[aria-current="step"]{color:var(--eink-ink);font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* store */
.store{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.chrome i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block;flex:none}
.chrome .url{flex:1;min-width:0;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shopnav{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;border-bottom:1px solid var(--line)}
.shopname{font-weight:700;letter-spacing:-.01em;font-size:17px}
.shopnav .search{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted);font-size:13px}
.shopnav a{color:var(--muted);font-size:13px;text-decoration:none}
.product{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;padding:22px 20px;border-bottom:1px solid var(--line)}
.product h3{font-size:22px;letter-spacing:-.01em}
.product .m{color:var(--muted);font-size:13.5px}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.rail{padding:18px 20px;border-bottom:1px solid var(--line)}
.rail h4{font-size:15px;margin-bottom:12px}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mini{display:grid;gap:6px;font-size:12.5px;align-content:start}
.mini .cover{width:100%;height:auto;aspect-ratio:2/3;max-width:110px}
.mini .by{color:var(--muted);font-size:11.5px}
.mini .pr2{font-size:12px;font-weight:600}
.nbwidget{padding:18px 20px 22px;display:grid;gap:14px;background:linear-gradient(var(--accent-soft),transparent 160px)}
.whead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px}
.whead h4{font-size:17px}
.nbwidget .group{grid-template-columns:130px minmax(0,1fr);align-items:baseline;gap:4px 12px}
.nbwidget .groups{gap:8px}
.nbwidget .ana .in{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);column-gap:28px}
.nbwidget .ana .in>.comp{grid-column:1/-1}
.nbwidget .ana .in>.also{grid-column:1/-1}

/* phone */
.phone{width:min(100%,390px);background:var(--bezel);border-radius:40px;padding:12px;box-shadow:var(--shadow)}
.screen{background:var(--bg);border-radius:30px;height:720px;overflow:auto;position:relative}
.notch{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:10px 22px 6px;font-size:12px;font-weight:600}
.notch .pill{width:90px;height:22px;border-radius:12px;background:var(--bezel)}
.qrhead{padding:6px 18px 14px;display:grid;gap:6px}
.qrhead .where{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.qrhead h3{font-size:20px;line-height:1.2}
.qrbody{padding:0 12px 20px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card label.f{font-size:12.5px;color:var(--muted)}
.card select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.stock{font-size:12px;display:inline-flex;align-items:center;gap:6px;margin-top:6px}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.stock.order::before{background:var(--muted)}
.qrcode{width:44px;height:44px;flex:none}
.screen .pr{grid-template-columns:64px minmax(0,1fr) 74px;gap:8px}
.screen .comp b{font-size:15px}

/* dashboard */
.dash{width:100%;display:grid;gap:16px}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.dhead h3{font-size:20px}
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:9px;font-size:12.5px}
.seg span{padding:5px 10px;border-radius:7px;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--good)}
.panels{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.panels.even{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.panel h4{font-size:14px}
.panel .sub{font-size:12.5px;color:var(--muted);margin:-8px 0 0}
.funnel{display:grid;gap:9px}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.fr .track{height:22px;background:var(--sunk);border-radius:5px;overflow:hidden}
.fr .fill{height:100%;background:var(--accent);border-radius:5px}
.fr .val{text-align:right;font-family:var(--f-mono);font-size:12px}
.fr .rate{grid-column:2/4;font-size:11.5px;color:var(--muted);margin-top:-6px}
.bars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px}
.br .t{display:grid;gap:3px}
.br .track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.br .fill{height:100%;background:var(--accent)}
.br .val{text-align:right;font-family:var(--f-mono);font-size:12px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:420px;height:auto}
pre.snippet{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--f-mono);font-size:12px;line-height:1.55;overflow-x:auto;white-space:pre}
.bignum{font-size:34px;font-weight:600;letter-spacing:-.02em}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.stackbar span{display:block;height:100%}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);z-index:20;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .panels,.panels.even{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}

    var hits=loved.filter(function(t){return b.tags.indexOf(t)>-1;});

  var extra=r.b.tags.filter(function(t){return r.hits.indexOf(t)<0&&src.tags.indexOf(t)>-1;}).slice(0,4).map(low);
  var also=extra.length?'<div class="also">Also in common: '+esc(extra.join(", "))+'.</div>':"";
  return '<details class="ana" data-id="'+r.b.id+'"'+(open?" open":"")+'><summary>'+CAR+'Full match analysis</summary><div class="in">'+comp+'<div><h5>Story elements you loved</h5>'+els+'</div><div><h5>Story DNA profile</h5>'+prof+'</div>'+also+'</div></details>';
}
function picksHTML(st,opt){
  var res=recommend(st.src,st),src=BY[st.src];
  var lovedN=Object.keys(st.tags).filter(function(k){return st.tags[k]===1;}).length;
  if(!lovedN)return '<div class="empty">Tick at least one thing you loved to see matching books.</div>';
  if(!res.list.length)return '<div class="empty">No more matches for this combination. Loosen a filter or <button type="button" class="linkbtn" data-ctl="clearex">bring back the books you skipped</button>.</div>';
  var nt=Object.keys(TAGS).length,total=res.list.length;
  if(st.page*3>=total)st.page=0;
  var from=st.page*3,shown=res.list.slice(from,from+3);
  var moreRow='<div class="more"><span class="hint num">Showing '+(from+1)+'–'+(from+shown.length)+' of '+total+' matches</span><div style="display:flex;gap:8px;flex-wrap:wrap">'+(Object.keys(st.excluded||{}).length?'<button type="button" class="btn ghost" data-ctl="clearex">Undo skips</button>':'')+(total>3?'<button type="button" class="btn" data-ctl="more">Show different picks</button>':'')+'</div></div>';
  return '<div class="ranked">Ranked '+res.pool+' titles on '+nt+' story elements and '+AX.length+' profile dimensions</div><div class="picks">'+shown.map(function(r,i){
    var open=st.open[r.b.id]!==undefined?st.open[r.b.id]:i===0;
    return '<article class="pick"><div class="head">'+cover(r.b,58,86)+'<div style="min-width:0"><h4>'+esc(r.b.t)+'</h4><div class="by">'+esc(r.b.a)+' · '+r.b.pages+' pages</div>'+
      '<div class="scoreline"><span class="match num">'+r.pct+'% match</span><span class="subscore">'+r.hits.length+'/'+(r.hits.length+r.miss.length)+' loved · fit '+Math.round(r.fit*100)+'%</span></div>'+
      '<div class="why">'+whyLine(r,src)+'</div>'+(opt&&opt.stock?stockHTML(r.b):"")+
      '<div class="row"><button type="button" class="btn primary" data-act="'+(opt&&opt.stock?"reserve":"buy")+'" data-id="'+r.b.id+'">'+(opt&&opt.stock?"Reserve":"Buy")+' · '+eur(r.b.p)+'</button><button type="button" class="btn" data-act="'+(opt&&opt.stock?"map":"sample")+'" data-id="'+r.b.id+'">'+(opt&&opt.stock?"Show on map":"Read sample")+'</button><button type="button" class="btn ghost" data-ctl="nope" data-id="'+r.b.id+'">Not for me</button></div></div></div>'+analysisHTML(r,src,open)+'</article>';
  }).join("")+'</div>'+moreRow;
}
function stockHTML(b){
  var shelves=["B3","C1","A4","D2","B1","C5"],i=b.id.length%shelves.length,inStock=b.id.charCodeAt(0)%4!==0;
  return '<div><span class="stock'+(inStock?"":" order")+'">'+(inStock?"In stock · Shelf "+shelves[i]:"Order today, pick up tomorrow")+'</span></div>';
}
var tt;
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true;},2400);}
function wirePicks(root,st){
  root.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click",function(){
      var bk=BY[b.dataset.id],a=b.dataset.act;
      toast(a==="buy"?"“"+bk.t+"” added to your cart.":a==="sample"?"Opening a free sample of “"+bk.t+"”.":a==="reserve"?"Reserved. Pick up “"+bk.t+"” at the counter today.":"Shelf highlighted on the shop map.");
    });
  });
  root.querySelectorAll("details.ana").forEach(function(d){d.addEventListener("toggle",function(){st.open[d.dataset.id]=d.open;});});
}
/* One widget = chips + tune + picks, mounted in any container */
function Widget(p,st,opt){
  this.p=p;this.st=st;this.opt=opt||{};
}
Widget.prototype.mount=function(root){
  var self=this,st=this.st,p=this.p;
  var chips=root.querySelectorAll(".chip");
  chips.forEach(function(c){c.addEventListener("click",function(){
    var t=c.dataset.tag,s=st.tags[t]||0,ns=s===0?1:s===1?-1:0;
    if(ns===0)delete st.tags[t];else st.tags[t]=ns;st.page=0;
    c.dataset.s=ns;c.setAttribute("aria-pressed",ns!==0);
    c.setAttribute("aria-label",lab(t)+(ns===1?", loved":ns===-1?", leave out":""));
    self.refresh(root);if(self.opt.onChips)self.opt.onChips();
  });});
  var tune=root.querySelector("#"+p+"-tune");
  if(tune){
    tune.addEventListener("toggle",function(){st.tuneOpen=tune.open;});
    AX.forEach(function(x){var i=root.querySelector("#"+p+"-"+x.k);if(!i)return;i.addEventListener("input",function(){
      st.adj[x.k]=+i.value;st.page=0;var o=root.querySelector("#"+p+"-"+x.k+"-o");o.textContent=adjWord(x,+i.value);o.className=+i.value?"on":"";self.refresh(root);});});
    root.querySelector("#"+p+"-series").addEventListener("change",function(e){st.series=e.target.checked;st.page=0;self.refresh(root);});
    root.querySelector("#"+p+"-reset").addEventListener("click",function(){st.adj={};st.series=true;AX.forEach(function(x){var i=root.querySelector("#"+p+"-"+x.k);i.value=0;var o=root.querySelector("#"+p+"-"+x.k+"-o");o.textContent="Same";o.className="";});root.querySelector("#"+p+"-series").checked=true;self.refresh(root);});
  }
  this.refresh(root);
};
Widget.prototype.refresh=function(root){
  var self=this,st=this.st,c=root.querySelector("#"+this.p+"-picks");
  if(c){c.innerHTML=picksHTML(st,this.opt);wirePicks(c,st);
    c.querySelectorAll("[data-ctl]").forEach(function(b){b.addEventListener("click",function(){
      var k=b.dataset.ctl;
      if(k==="more"){st.page++;st.open={};}
      else if(k==="nope"){st.excluded[b.dataset.id]=true;st.open={};toast("Got it. “"+BY[b.dataset.id].t+"” won’t be suggested again.");}
      else if(k==="clearex"){st.excluded={};st.page=0;}
      self.refresh(root);
      var box=root.querySelector("#"+self.p+"-picks");if(box&&k==="more"&&box.scrollIntoView)box.scrollIntoView({block:"start",behavior:"smooth"});
    });});
  }
  var a=root.querySelector("#"+this.p+"-act");if(a)a.innerHTML=activeTags(this.st);
};
function newState(src,tags){var t={};tags.forEach(function(k){t[k]=1;});return {src:src,tags:t,adj:{},series:true,open:{},tuneOpen:false,excluded:{},page:0};}
function resetState(st,src,tags,extra){var n=newState(src,tags);Object.keys(st).forEach(function(k){delete st[k];});Object.keys(n).forEach(function(k){st[k]=n[k];});if(extra)Object.keys(extra).forEach(function(k){st[k]=extra[k];});}

/* ---------- E-reader ---------- */
var ER=newState("salt",["twotime","epistolary","poetic"]);ER.step=1;
var erW=new Widget("er",ER);
function renderER(){
  var el=document.getElementById("er-screen"),h="";
  h+='<div class="bar"><span>The Salt Orchard</span><span>100% · p. 384</span></div>';
  var steps='<div class="steps" aria-label="Steps"><span'+(ER.step===1?' aria-current="step"':"")+'>1 The end</span><span>·</span><span'+(ER.step===2?' aria-current="step"':"")+'>2 What you loved</span><span>·</span><span'+(ER.step===3?' aria-current="step"':"")+'>3 Your next books</span></div>';
  if(ER.step===1){
    h+='<div class="page"><p>She left the gate open behind her. Whatever the orchard had kept for sixty years, it could keep a little longer.</p><p>Down on the shore, Liese was already waving, her letters tucked under one arm like a loaf of bread.</p><div class="end">THE END</div></div>';
    h+='<div class="sheet">'+steps+'<h3>You finished <i>The Salt Orchard</i>.</h3><p>What stayed with you? Tell us and get three books that match exactly that.</p><div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" id="er-go">Find my next book</button><button type="button" class="btn" id="er-later">Not now</button></div><span class="powered">'+MARK+'Nextbook</span></div>';
  }else if(ER.step===2){
    var n=Object.keys(ER.tags).filter(function(k){return ER.tags[k]===1;}).length;
    h+='<div class="sheet" style="border-top:0">'+steps+'<h3>What stayed with you?</h3><p>The Story DNA of <i>The Salt Orchard</i>.</p>'+LEGEND+chipsHTML("salt",ER,true)+'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn primary" id="er-show"'+(n?"":" disabled")+'>Show my next books</button><span class="num" id="er-count" style="font-size:12px;color:var(--eink-muted)">'+n+' loved</span></div></div>';
  }else{
    h+='<div class="sheet" style="border-top:0">'+steps+'<h3>Your next books</h3>'+tuneHTML("er",ER)+'<div id="er-picks" style="display:grid;gap:8px"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn" id="er-edit">Edit what I loved</button><button type="button" class="btn" id="er-restart">Start over</button></div><span class="powered">'+MARK+'Nextbook</span></div>';
  }
  el.innerHTML=h;el.scrollTop=0;
  var q=function(id){return el.querySelector("#"+id);};
  if(q("er-go"))q("er-go").onclick=function(){ER.step=2;renderER();};
  if(q("er-later"))q("er-later").onclick=function(){toast("Saved. We’ll ask again from your library.");};
  if(q("er-show"))q("er-show").onclick=function(){ER.step=3;ER.open={};ER.page=0;renderER();};
  if(q("er-edit"))q("er-edit").onclick=function(){ER.step=2;renderER();};
  if(q("er-restart"))q("er-restart").onclick=function(){resetState(ER,"salt",[],{step:1});renderER();};
  if(ER.step===2){
    el.querySelectorAll(".chip").forEach(function(c){c.addEventListener("click",function(){
      var t=c.dataset.tag,s=ER.tags[t]||0,ns=s===0?1:s===1?-1:0;
      if(ns===0)delete ER.tags[t];else ER.tags[t]=ns;c.dataset.s=ns;c.setAttribute("aria-pressed",ns!==0);
      var n=Object.keys(ER.tags).filter(function(k){return ER.tags[k]===1;}).length;
      q("er-count").textContent=n+" loved";q("er-show").disabled=!n;
    });});
  }
  if(ER.step===3)erW.mount(el);
}

/* ---------- Store ---------- */
var ST=newState("salt",["twotime","epistolary","sisters"]);ST.tuneOpen=true;
var stW=new Widget("st",ST);
function renderStore(){
  var b=BY.salt;
  document.getElementById("st-product").innerHTML=cover(b,112,168)+'<div style="min-width:0;display:grid;gap:6px;align-content:start"><div class="eyebrow">Fiction · Historical</div><h3>'+b.t+'</h3><div class="m">'+b.a+' · E-book · '+b.pages+' pages · '+eur(b.p)+'</div><div class="m">Two sisters, one orchard on the Baltic coast, and a box of letters nobody was meant to read.</div><div><span class="badge">In your library · finished 2 days ago</span></div></div>';
  var rail=["stone","keeper","inherit","tide"].map(function(id){return BY[id];});
  document.getElementById("st-rail").innerHTML=rail.map(function(x){return '<div class="mini">'+cover(x)+'<div><b style="font-size:13px">'+esc(x.t)+'</b><div class="by">'+esc(x.a)+'</div><div class="pr2">'+eur(x.p)+'</div></div></div>';}).join("");
  var el=document.getElementById("st-widget");

  stW.mount(el);
  el.querySelector("#st-over").addEventListener("click",function(){resetState(ST,"salt",[],{tuneOpen:true});renderStore();});
}

/* ---------- QR ---------- */
var QR=newState("salt",["epistolary","slowburn"]);
var qrW=new Widget("qr",QR,{stock:true});
var QRSVG='<svg class="qrcode" viewBox="0 0 21 21" aria-hidden="true"><rect width="21" height="21" fill="var(--surface)"/><g fill="var(--ink)"><path d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zm1 1v5h5V1zm1 1h3v3h-3zM0 14h7v7H0zm1 1v5h5v-5zm1 1h3v3H2z"/><path d="M8 0h2v2H8zM11 1h2v3h-2zM8 3h2v2H8zM9 6h3v2H9zM8 9h2v3H8zM11 9h3v2h-3zM15 8h2v2h-2zM18 8h3v2h-3zM13 12h2v2h-2zM16 11h2v3h-2zM19 12h2v2h-2zM8 14h3v2H8zM12 15h3v2h-3zM16 15h2v2h-2zM19 16h2v3h-2zM9 18h2v3H9zM12 18h3v3h-3zM16 19h2v2h-2zM0 8h2v2H0zM3 9h3v2H3zM1 11h2v2H1z"/></g></svg>';
function renderQR(){
  var el=document.getElementById("qr-screen"),y=el.scrollTop;
  var opts=BOOKS.map(function(b){return '<option value="'+b.id+'"'+(b.id===QR.src?" selected":"")+'>'+esc(b.t)+' – '+esc(b.a)+'</option>';}).join("");

   '<div style="display:flex;justify-content:space-between;align-items:center;padding-inline:4px"><button type="button" class="linkbtn" id="qr-over">Start over</button><span class="powered">'+MARK+'Nextbook</span></div></div>';
  el.scrollTop=y;

/* ---------- Dashboard ---------- */
function renderDash(){
  var weeks=[{w:"W31",r:9800},{w:"W32",r:11200},{w:"W33",r:12100},{w:"W34",r:13400},{w:"W35",r:14000},{w:"W36",r:15600},{w:"W37",r:16900},{w:"W38",r:17900}];
  var funnel=[{l:"Saw Nextbook",v:48200},{l:"Told us what they loved",v:14940},{l:"Opened a pick",v:6870},{l:"Bought a pick",v:1210}];
  var dims=[{l:"Two timelines that meet",v:18},{l:"A midpoint reveal that changes everything",v:15},{l:"Told through letters and diaries",v:12},{l:"Hooks you on page one",v:11},{l:"Found family",v:9}];
  var adjs=[{l:"Lighter",v:24},{l:"Shorter",v:19},{l:"Faster",v:16},{l:"Hidden gems",v:12},{l:"Plainer vocabulary",v:9}];
  var last=weeks[weeks.length-1].r,first=weeks[0].r;
  function k(n){return n.toLocaleString("de-AT");}
  function kpi(l,v,d){return '<div class="kpi"><span class="l">'+l+'</span><span class="v num">'+v+'</span><span class="d">'+d+'</span></div>';}
  function bars(list){return '<div class="bars">'+list.map(function(d){return '<div class="br"><div class="t"><span>'+d.l+'</span><div class="track"><div class="fill" style="width:'+(d.v/list[0].v*100)+'%"></div></div></div><span class="val">'+d.v+'%</span></div>';}).join("")+'</div>';}
  var h='<div class="dhead"><div><div class="eyebrow">Leseinsel · Partner dashboard</div><h3>Week 38, 2026</h3></div><div class="seg" aria-hidden="true"><span>Day</span><span class="on">Week</span><span>Month</span></div></div>';
  h+='<div class="kpis">'+kpi("Readers who saw Nextbook",k(48200),"+6% vs. week 37")+kpi("Books sold through a pick",k(1210),"2.5% of readers reached")+kpi("Revenue from those books","€"+k(last),"+"+Math.round((last/first-1)*100)+"% since week 31")+kpi("Nextbook commission (10%)","€"+k(Math.round(last*.1)),"Paid only on sales")+'</div>';
  var fh='<div class="funnel">'+funnel.map(function(f,i){var w=f.v/funnel[0].v*100,rate=i?Math.round(f.v/funnel[i-1].v*1000)/10+"% of previous step":"";return '<div class="fr"><span>'+f.l+'</span><div class="track"><div class="fill" style="width:'+w.toFixed(1)+'%"></div></div><span class="val">'+k(f.v)+'</span>'+(rate?'<span class="rate">'+rate+'</span>':"")+'</div>';}).join("")+'</div>';
  var W=560,H=220,L=48,R=36,T=14,Bm=30,max=20000,bw=(W-L-R)/weeks.length;
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly revenue from recommended books rose from 9,800 to 17,900 euros over eight weeks">';
  [0,5000,10000,15000,20000].forEach(function(v){var y=T+(H-T-Bm)*(1-v/max);svg+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">'+(v?"€"+v/1000+"k":"0")+'</text>';});
  weeks.forEach(function(d,i){var bh=(H-T-Bm)*d.r/max,x=L+i*bw+bw*.2,y=T+(H-T-Bm)-bh,isLast=i===weeks.length-1;
    svg+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--accent)" fill-opacity="'+(isLast?1:.45)+'"><title>'+d.w+': €'+k(d.r)+'</title></rect>';
    svg+='<text x="'+(x+bw*.3).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">'+d.w+'</text>';
    if(isLast)svg+='<text x="'+(x+bw*.3).toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11.5" font-weight="600" fill="var(--ink)">€'+k(d.r)+'</text>';
  });
  svg+='</svg>';
  var snippet='&lt;div id="nextbook"&gt;&lt;/div&gt;\n&lt;script src="https://cdn.nextbook.example/widget.js"\n  data-partner="leseinsel"\n  data-isbn="{{book.isbn}}"\n  data-trigger="last-page"&gt;&lt;/script&gt;';
  h+='<div class="panels"><div class="panel"><h4>Revenue from recommended books</h4><p class="sub">Per week, before commission</p><div class="chartbox">'+svg+'</div></div><div class="panel"><h4>From reader to sale</h4><p class="sub">Week 38</p>'+fh+'</div></div>';
  h+='<div class="panels even"><div class="panel"><h4>What your readers loved most</h4><p class="sub">Share of all ticked story elements</p>'+bars(dims)+'</div>'+
     '<div class="panel"><h4>How readers fine-tune</h4><p class="sub">Share of sessions using each adjustment</p>'+bars(adjs)+'</div>'+
     '<div class="panel"><h4>Backlist brought back</h4><p class="sub">Books sold through a pick, by publication date</p><div class="bignum num">41%</div><div class="stackbar"><span style="width:59%;background:var(--accent)"></span><span style="width:41%;background:var(--good)"></span></div><div class="legend"><span><i style="background:var(--accent)"></i>Under 2 years old 59%</span><span><i style="background:var(--good)"></i>Backlist 41%</span></div></div></div>';
  h+='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h4>Embed code</h4><button type="button" class="btn" id="copy-snip">Copy code</button></div><pre class="snippet" id="snip">'+snippet+'</pre></div>';
  var el=document.getElementById("dash");el.innerHTML=h;
  el.querySelector("#copy-snip").addEventListener("click",function(){
    var node=el.querySelector("#snip"),txt=node.textContent;
    function sel(){var r=document.createRange();r.selectNodeContents(node);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("Code selected. Press Ctrl+C to copy.");}
    try{navigator.clipboard.writeText(txt).then(function(){toast("Code copied.");},sel);}catch(e){sel();}
  });
}

/* ---------- Tabs ---------- */
var tabs=[].slice.call(document.querySelectorAll(".tab"));
function show(id){tabs.forEach(function(t){var on=t.getAttribute("aria-controls")===id;t.setAttribute("aria-selected",on);t.tabIndex=on?0:-1;document.getElementById(t.getAttribute("aria-controls")).hidden=!on;});}
tabs.forEach(function(t,i){
  t.addEventListener("click",function(){var id=t.getAttribute("aria-controls");show(id);try{localStorage.setItem("nb-tab",id);}catch(e){}});
  t.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key==="ArrowLeft"){var n=tabs[(i+(e.key==="ArrowRight"?1:tabs.length-1))%tabs.length];n.focus();n.click();}});
});
var map={ereader:"p-ereader",store:"p-store",qr:"p-qr",dashboard:"p-dash"},start="p-ereader";
try{var saved=localStorage.getItem("nb-tab");if(saved&&document.getElementById(saved))start=saved;}catch(e){}
if(map[location.hash.slice(1)])start=map[location.hash.slice(1)];
renderER();renderStore();renderQR();renderDash();show(start);
document.getElementById("restart-all").addEventListener("click",function(){
  resetState(ER,"salt",[],{step:1});resetState(ST,"salt",[],{tuneOpen:true});resetState(QR,"salt",[]);
  renderER();renderStore();renderQR();document.getElementById("qr-screen").scrollTop=0;
  window.scrollTo(0,0);toast("Demo restarted.");
});
})();
</script>
